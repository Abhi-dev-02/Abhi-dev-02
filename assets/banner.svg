<svg fill="none" viewBox="0 0 1000 320" width="1000" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B11"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="75%" stop-color="#EC4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes float1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    .pulsing-orb { animation: pulse 6s ease-in-out infinite alternate; transform-origin: center; }
    .floating-card1 { animation: float1 4s ease-in-out infinite; }
    .floating-card2 { animation: float2 5s ease-in-out infinite; }
    .mono-text { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
    .sans-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="320" rx="16" fill="url(#bgGradient)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 40 H1000 M0 80 H1000 M0 120 H1000 M0 160 H1000 M0 200 H1000 M0 240 H1000 M0 280 H1000"/>
    <path d="M100 0 V320 M200 0 V320 M300 0 V320 M400 0 V320 M500 0 V320 M600 0 V320 M700 0 V320 M800 0 V320 M900 0 V320"/>
  </g>

  <!-- Glowing Background Orbs -->
  <circle cx="150" cy="80" r="140" fill="#00F2FE" opacity="0.12" filter="url(#glow)" class="pulsing-orb"/>
  <circle cx="850" cy="240" r="160" fill="#A855F7" opacity="0.14" filter="url(#glow)" class="pulsing-orb"/>
  <circle cx="500" cy="160" r="90" fill="#EC4899" opacity="0.08" filter="url(#glow)"/>

  <!-- Border Highlight -->
  <rect x="1" y="1" width="998" height="318" rx="15" fill="none" stroke="url(#accentLine)" stroke-width="1.5"/>

  <!-- Left Content Block -->
  <g transform="translate(60, 48)">
    <!-- Terminal Header Badge -->
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#EF4444"/>
    <circle cx="32" cy="14" r="5" fill="#F59E0B"/>
    <circle cx="48" cy="14" r="5" fill="#10B981"/>
    <text x="64" y="18" fill="#94A3B8" class="mono-text" font-size="11" font-weight="600">abhi.dev.init()</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#F8FAFC" class="sans-text" font-size="44" font-weight="800" letter-spacing="-1">
      Abhishek <tspan fill="url(#neonCyanPurple)">Kudale</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="118" fill="#94A3B8" class="sans-text" font-size="17" font-weight="500">
      B.Tech CSE (AI &amp; ML) <tspan fill="#38BDF8">@ MITAOE Pune</tspan> • Full-Stack &amp; Data Science
    </text>

    <!-- Key Skill Pills -->
    <g transform="translate(0, 150)">
      <!-- Pill 1: Artificial Intelligence -->
      <g transform="translate(0, 0)">
        <rect width="130" height="30" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
        <text x="14" y="20" fill="#38BDF8" class="mono-text" font-size="12" font-weight="600">🧠 AI / ML</text>
      </g>
      <!-- Pill 2: Data Science -->
      <g transform="translate(142, 0)">
        <rect width="145" height="30" rx="8" fill="#0F172A" stroke="#7C3AED" stroke-width="1"/>
        <text x="14" y="20" fill="#C084FC" class="mono-text" font-size="12" font-weight="600">📊 Data Science</text>
      </g>
      <!-- Pill 3: Full Stack -->
      <g transform="translate(299, 0)">
        <rect width="145" height="30" rx="8" fill="#0F172A" stroke="#059669" stroke-width="1"/>
        <text x="14" y="20" fill="#34D399" class="mono-text" font-size="12" font-weight="600">💻 Web Systems</text>
      </g>
      <!-- Pill 4: C++ & DSA -->
      <g transform="translate(456, 0)">
        <rect width="145" height="30" rx="8" fill="#0F172A" stroke="#DB2777" stroke-width="1"/>
        <text x="14" y="20" fill="#F472B6" class="mono-text" font-size="12" font-weight="600">⚡ C++ &amp; DSA</text>
      </g>
    </g>

    <!-- Bottom Status Text -->
    <text x="2" y="224" fill="#64748B" class="mono-text" font-size="13">
      <tspan fill="#10B981">●</tspan> Exploring intelligent architectures &amp; building high-performance software
    </text>
  </g>

  <!-- Right Visual Feature: Floating Code Card -->
  <g transform="translate(710, 52)" class="floating-card1">
    <rect width="230" height="215" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#subtleGlow)"/>
    
    <!-- Code Window Titlebar -->
    <path d="M0 14 C0 6.268 6.268 0 14 0 H216 C223.732 0 230 6.268 230 14 V32 H0 Z" fill="#0F172A" opacity="0.9"/>
    <circle cx="18" cy="16" r="4" fill="#EF4444" opacity="0.8"/>
    <circle cx="30" cy="16" r="4" fill="#F59E0B" opacity="0.8"/>
    <circle cx="42" cy="16" r="4" fill="#10B981" opacity="0.8"/>
    <text x="60" y="20" fill="#64748B" class="mono-text" font-size="10">developer.json</text>

    <!-- Code Snippet -->
    <g transform="translate(18, 56)" class="mono-text" font-size="11">
      <text y="0" fill="#EC4899">const <tspan fill="#38BDF8">engineer</tspan> = {</text>
      <text y="20" fill="#94A3B8">  name: <tspan fill="#FDE047">'Abhishek'</tspan>,</text>
      <text y="40" fill="#94A3B8">  role: <tspan fill="#FDE047">'AIML Engineer'</tspan>,</text>
      <text y="60" fill="#94A3B8">  code: [<tspan fill="#34D399">'C++'</tspan>, <tspan fill="#34D399">'Python'</tspan>],</text>
      <text y="80" fill="#94A3B8">  passion: <tspan fill="#FDE047">'Innovation'</tspan>,</text>
      <text y="100" fill="#94A3B8">  status: <tspan fill="#10B981">'Building 🚀'</tspan></text>
      <text y="122" fill="#EC4899">};</text>
      <text y="142" fill="#64748B">// Ready to create</text>
    </g>
  </g>

  <!-- Bottom Accent Separator -->
  <line x1="60" y1="316" x2="940" y2="316" stroke="url(#accentLine)" stroke-width="2"/>
</svg>
