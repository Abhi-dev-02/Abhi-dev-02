<svg fill="none" viewBox="0 0 1000 320" width="1000" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#06090E"/>
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="neonText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="borderLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="80%" stop-color="#EC4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardDropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <style>
    @keyframes subtlePulse {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.55; }
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    .pulsing-glow { animation: subtlePulse 5s ease-in-out infinite alternate; }
    .floating-card { animation: floatY 4s ease-in-out infinite; }
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="320" rx="16" fill="url(#bgGradient)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 40 H1000 M0 80 H1000 M0 120 H1000 M0 160 H1000 M0 200 H1000 M0 240 H1000 M0 280 H1000"/>
    <path d="M100 0 V320 M200 0 V320 M300 0 V320 M400 0 V320 M500 0 V320 M600 0 V320 M700 0 V320 M800 0 V320 M900 0 V320"/>
  </g>

  <!-- Glowing Ambient Background Orbs -->
  <circle cx="140" cy="90" r="130" fill="#00F2FE" opacity="0.10" filter="url(#glow)" class="pulsing-glow"/>
  <circle cx="840" cy="160" r="150" fill="#A855F7" opacity="0.14" filter="url(#glow)" class="pulsing-glow"/>
  <circle cx="500" cy="280" r="90" fill="#EC4899" opacity="0.08" filter="url(#glow)"/>

  <!-- Glowing Outer Frame Border -->
  <rect x="1" y="1" width="998" height="318" rx="15" fill="none" stroke="url(#borderLine)" stroke-width="1.5"/>

  <!-- ==================== LEFT COLUMN: BIO & TITLES ==================== -->
  <g transform="translate(50, 45)">
    <!-- Terminal Header Badge -->
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="14" r="4.5" fill="#EF4444"/>
    <circle cx="30" cy="14" r="4.5" fill="#F59E0B"/>
    <circle cx="44" cy="14" r="4.5" fill="#10B981"/>
    <text x="58" y="18" fill="#94A3B8" class="mono" font-size="11" font-weight="600">abhi.dev.init()</text>

    <!-- Main Title -->
    <text x="0" y="82" fill="#F8FAFC" class="sans" font-size="42" font-weight="800" letter-spacing="-1">
      Abhishek <tspan fill="url(#neonText)">Kudale</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="120" fill="#94A3B8" class="sans" font-size="16" font-weight="500">
      B.Tech CSE (AI &amp; ML) <tspan fill="#38BDF8" font-weight="700">@ MITAOE Pune</tspan> • Full-Stack &amp; Data Science
    </text>

    <!-- Key Skill Pills Row -->
    <g transform="translate(0, 150)">
      <!-- Pill 1: Artificial Intelligence -->
      <g transform="translate(0, 0)">
        <rect width="125" height="32" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
        <text x="14" y="21" fill="#38BDF8" class="mono" font-size="12" font-weight="600">🧠 AI / ML</text>
      </g>
      <!-- Pill 2: Data Science -->
      <g transform="translate(135, 0)">
        <rect width="145" height="32" rx="8" fill="#0F172A" stroke="#7C3AED" stroke-width="1"/>
        <text x="14" y="21" fill="#C084FC" class="mono" font-size="12" font-weight="600">📊 Data Science</text>
      </g>
      <!-- Pill 3: Full Stack -->
      <g transform="translate(290, 0)">
        <rect width="145" height="32" rx="8" fill="#0F172A" stroke="#059669" stroke-width="1"/>
        <text x="14" y="21" fill="#34D399" class="mono" font-size="12" font-weight="600">💻 Full-Stack</text>
      </g>
      <!-- Pill 4: C++ & DSA -->
      <g transform="translate(445, 0)">
        <rect width="135" height="32" rx="8" fill="#0F172A" stroke="#DB2777" stroke-width="1"/>
        <text x="14" y="21" fill="#F472B6" class="mono" font-size="12" font-weight="600">⚡ C++ &amp; DSA</text>
      </g>
    </g>

    <!-- Bottom Status Text -->
    <g transform="translate(0, 222)">
      <circle cx="6" cy="-4" r="4" fill="#10B981"/>
      <text x="18" y="0" fill="#64748B" class="mono" font-size="12.5">
        Crafting intelligent architectures &amp; scalable software systems
      </text>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: FLOATING CODE WINDOW ==================== -->
  <!-- Outer group anchors position permanently on right side (x: 650, y: 44) -->
  <g transform="translate(650, 44)">
    <!-- Inner group handles only relative vertical floating animation -->
    <g class="floating-card">
      <!-- Main Code Window Base with Drop Shadow -->
      <rect width="300" height="232" rx="14" fill="#0F172A" stroke="url(#cardBorder)" stroke-width="1.5" filter="url(#cardDropShadow)"/>
      
      <!-- Window Titlebar -->
      <path d="M0 14 C0 6.268 6.268 0 14 0 H286 C293.732 0 300 6.268 300 14 V34 H0 Z" fill="#1E293B" opacity="0.95"/>
      <circle cx="18" cy="17" r="4.5" fill="#EF4444"/>
      <circle cx="32" cy="17" r="4.5" fill="#F59E0B"/>
      <circle cx="46" cy="17" r="4.5" fill="#10B981"/>
      <text x="64" y="21" fill="#94A3B8" class="mono" font-size="11" font-weight="600">developer.json</text>

      <!-- Code Snippet -->
      <g transform="translate(20, 60)" class="mono" font-size="11.5">
        <text y="0" fill="#EC4899">const <tspan fill="#38BDF8">engineer</tspan> = {</text>
        <text y="22" fill="#94A3B8">  name: <tspan fill="#FDE047">'Abhishek Kudale'</tspan>,</text>
        <text y="44" fill="#94A3B8">  role: <tspan fill="#FDE047">'AIML Engineer'</tspan>,</text>
        <text y="66" fill="#94A3B8">  stack: [<tspan fill="#34D399">'C++'</tspan>, <tspan fill="#34D399">'Python'</tspan>, <tspan fill="#34D399">'TS'</tspan>],</text>
        <text y="88" fill="#94A3B8">  focus: <tspan fill="#FDE047">'AI &amp; Data Science'</tspan>,</text>
        <text y="110" fill="#94A3B8">  status: <tspan fill="#10B981">'Building 🚀'</tspan></text>
        <text y="134" fill="#EC4899">};</text>
        <text y="156" fill="#64748B">// Ready for collaboration</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Separator Line -->
  <line x1="50" y1="316" x2="950" y2="316" stroke="url(#borderLine)" stroke-width="2"/>
</svg>