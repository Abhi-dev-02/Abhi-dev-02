<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#9D4EDD" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow3d" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="pipe1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="pipe2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .floating-core { animation: floatOrb 4s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 800; fill: #F8FAFC; letter-spacing: -0.5px; }
    .subtitle-text { font-family: 'Fira Code', monospace; font-size: 11px; fill: #94A3B8; }
  </style>

  <!-- Background Card -->
  <rect width="900" height="360" rx="16" fill="#0A0E17" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Subtle Isometric Grid Base -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="1">
    <line x1="50" y1="200" x2="450" y2="320" />
    <line x1="150" y1="150" x2="550" y2="270" />
    <line x1="250" y1="100" x2="650" y2="220" />
    <line x1="350" y1="50" x2="750" y2="170" />
    <line x1="450" y1="20" x2="850" y2="140" />

    <line x1="850" y1="200" x2="450" y2="320" />
    <line x1="750" y1="150" x2="350" y2="270" />
    <line x1="650" y1="100" x2="250" y2="220" />
    <line x1="550" y1="50" x2="150" y2="170" />
    <line x1="450" y1="20" x2="50" y2="140" />
  </g>

  <!-- Title Header -->
  <g transform="translate(40, 42)">
    <text class="title-text">⚡ 3D Developer Architecture &amp; Tech Stack Ecosystem</text>
    <text y="20" class="subtitle-text">Abhishek Kudale • Intelligent Systems &amp; High-Performance Engineering</text>
  </g>

  <!-- Holographic Connection Traces -->
  <g stroke-width="3" stroke-linecap="round" opacity="0.75" filter="url(#glow3d)">
    <line x1="450" y1="190" x2="170" y2="230" stroke="#00F2FE" />
    <line x1="450" y1="190" x2="340" y2="130" stroke="#3B82F6" />
    <line x1="450" y1="190" x2="580" y2="125" stroke="#A855F7" />
    <line x1="450" y1="190" x2="730" y2="235" stroke="#EC4899" />
  </g>

  <!-- 3D CENTRAL CORE: AI & NEURAL ENGINE -->
  <g class="floating-core">
    <!-- Central Pedestal -->
    
    <!-- 3D Cube at (450, 240) -->
    <polygon points="390,190 450,222 450,272 390,240" fill="#0F172A"/>
    <polygon points="450,222 510,190 510,240 450,272" fill="#0B1120"/>
    <polygon points="450,158 510,190 450,222 390,190" fill="#1E293B"/>
    
    
    <!-- Core Glowing Crystal / AI Cube -->
    
    <!-- 3D Cube at (450, 195) -->
    <polygon points="414,153 450,173 450,215 414,195" fill="#0284C7"/>
    <polygon points="450,173 486,153 486,195 450,215" fill="#0369A1"/>
    <polygon points="450,133 486,153 450,173 414,153" fill="#38BDF8"/>
    <text x="450" y="157" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">AI / ML</text>
    
    <!-- Floating Orbit Ring -->
    <ellipse cx="450" cy="155" rx="75" ry="22" fill="none" stroke="url(#gridGlow)" stroke-width="2" filter="url(#glow3d)" stroke-dasharray="6 4"/>
  </g>

  <!-- NODE 1: Python & Data Science (Left Bottom) -->
  <g>
    <!-- Base Platform -->
    
    <!-- 3D Cube at (170, 265) -->
    <polygon points="122,233 170,259 170,291 122,265" fill="#111827"/>
    <polygon points="170,259 218,233 218,265 170,291" fill="#0A0E1A"/>
    <polygon points="170,207 218,233 170,259 122,233" fill="#1E293B"/>
    
    
    <!-- Python / Data Cube -->
    
    <!-- 3D Cube at (170, 238) -->
    <polygon points="140,202 170,218 170,254 140,238" fill="#0891B2"/>
    <polygon points="170,218 200,202 200,238 170,254" fill="#0E7490"/>
    <polygon points="170,186 200,202 170,218 140,202" fill="#00F2FE"/>
    <text x="170" y="206" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Python</text>
    
    <text x="170" y="325" text-anchor="middle" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">📊 Data Science</text>
    <text x="170" y="340" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">Pandas • NumPy • EDA</text>
  </g>

  <!-- NODE 2: C++ & DSA Engine (Left Top) -->
  <g>
    <!-- Base Platform -->
    
    <!-- 3D Cube at (340, 160) -->
    <polygon points="296,132 340,156 340,184 296,160" fill="#111827"/>
    <polygon points="340,156 384,132 384,160 340,184" fill="#0A0E1A"/>
    <polygon points="340,108 384,132 340,156 296,132" fill="#1E293B"/>
    
    
    <!-- C++ Cube -->
    
    <!-- 3D Cube at (340, 136) -->
    <polygon points="312,104 340,119 340,151 312,136" fill="#2563EB"/>
    <polygon points="340,119 368,104 368,136 340,151" fill="#1D4ED8"/>
    <polygon points="340,89 368,104 340,119 312,104" fill="#3B82F6"/>
    <text x="340" y="108" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">C++ / OOP</text>
    
    <text x="340" y="205" text-anchor="middle" fill="#60A5FA" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">⚡ C++ &amp; DSA</text>
    <text x="340" y="220" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">Algorithms • Logic</text>
  </g>

  <!-- NODE 3: Intelligent Optimization / SML (Right Top) -->
  <g>
    <!-- Base Platform -->
    
    <!-- 3D Cube at (580, 155) -->
    <polygon points="536,127 580,151 580,179 536,155" fill="#111827"/>
    <polygon points="580,151 624,127 624,155 580,179" fill="#0A0E1A"/>
    <polygon points="580,103 624,127 580,151 536,127" fill="#1E293B"/>
    
    
    <!-- SML Cube -->
    
    <!-- 3D Cube at (580, 131) -->
    <polygon points="552,99 580,114 580,146 552,131" fill="#9333EA"/>
    <polygon points="580,114 608,99 608,131 580,146" fill="#7E22CE"/>
    <polygon points="580,84 608,99 580,114 552,99" fill="#A855F7"/>
    <text x="580" y="103" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Optimizer</text>
    
    <text x="580" y="200" text-anchor="middle" fill="#C084FC" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">🚀 Code Optimiser</text>
    <text x="580" y="215" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">AST • Machine Learning</text>
  </g>

  <!-- NODE 4: Web & Full-Stack Systems (Right Bottom) -->
  <g>
    <!-- Base Platform -->
    
    <!-- 3D Cube at (730, 270) -->
    <polygon points="682,238 730,264 730,296 682,270" fill="#111827"/>
    <polygon points="730,264 778,238 778,270 730,296" fill="#0A0E1A"/>
    <polygon points="730,212 778,238 730,264 682,238" fill="#1E293B"/>
    
    
    <!-- Web Cube -->
    
    <!-- 3D Cube at (730, 243) -->
    <polygon points="700,207 730,223 730,259 700,243" fill="#DB2777"/>
    <polygon points="730,223 760,207 760,243 730,259" fill="#BE185D"/>
    <polygon points="730,191 760,207 730,223 700,207" fill="#EC4899"/>
    <text x="730" y="211" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Web / TS</text>
    
    <text x="730" y="330" text-anchor="middle" fill="#F472B6" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">🌐 Full-Stack Web</text>
    <text x="730" y="345" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">React • Node • TS • CSS</text>
  </g>

</svg>